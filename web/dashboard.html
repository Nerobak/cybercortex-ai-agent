<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CyberCortex // Bug Bounty Cockpit</title>
  <style>
    :root{--bg:#07100d;--panel:#0c1915;--line:#1d3a30;--text:#e5f2ec;--muted:#8eaa9f;--green:#54f5a6;--amber:#ffca62;--red:#ff6b75}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#123729 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh}.shell{width:min(1180px,92vw);margin:auto;padding:42px 0}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:32px}.eyebrow{color:var(--green);letter-spacing:.14em;font-size:12px}.logo{font-size:clamp(25px,4vw,44px);font-weight:800;letter-spacing:-.05em}.status{border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1.45fr;gap:18px}.panel{background:linear-gradient(145deg,rgba(15,32,26,.96),rgba(8,20,16,.96));border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 60px #0005}.panel h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 18px;color:var(--muted)}label{display:block;margin:14px 0 7px;color:var(--muted)}input[type=url]{width:100%;padding:13px;background:#050d0a;border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--green)}.confirm{display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:var(--text);font-family:system-ui,sans-serif;font-size:13px}.confirm input{margin-top:3px;accent-color:var(--green)}button,.download{width:100%;border:0;border-radius:9px;background:var(--green);color:#042015;padding:13px;font:700 14px ui-monospace,monospace;cursor:pointer;text-decoration:none;text-align:center;display:block}button:disabled{opacity:.4;cursor:not-allowed}.scope{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.chip{border:1px solid var(--line);border-radius:20px;padding:4px 8px;color:var(--text)}.empty{height:330px;display:grid;place-content:center;text-align:center;color:var(--muted)}.radar{font-size:45px;color:var(--green);animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35}}.progress{height:7px;background:#07100d;border-radius:10px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:var(--green);width:0;transition:width .3s}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.finding{border-left:3px solid var(--amber);background:#091510;padding:12px 14px;margin:9px 0;border-radius:0 8px 8px 0}.finding.info{border-color:#6ea8ff}.finding b{display:block}.finding small{color:var(--muted)}details{margin-top:16px}pre{white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto;background:#050d0a;border-radius:8px;padding:14px;color:#acd2c1}.error{color:var(--red)}.download{margin-top:16px;background:transparent;color:var(--green);border:1px solid var(--green)}@media(max-width:800px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header><div><div class="eyebrow">AUTHORIZED SECURITY WORKBENCH</div><div class="logo">CYBER//CORTEX</div></div><div class="status">● LOCAL ENGINE ONLINE</div></header>
  <div class="grid">
    <section class="panel"><h2>01 / Assessment scope</h2>
      <form id="scan-form"><label for="target">Target URL</label><input id="target" type="url" placeholder="https://app.example.com" required>
      <label class="confirm"><input id="authorized" type="checkbox" required><span>I confirm I own this target or have explicit permission to assess it, and will follow the program rules.</span></label>
      <button id="launch" type="submit">LAUNCH SAFE ASSESSMENT →</button></form>
      <div class="scope"><b>CONFIGURED ALLOWLIST</b><div id="scope-list" class="chips"><span class="chip">Loading…</span></div></div>
    </section>
    <section class="panel"><h2>02 / Live intelligence</h2><div id="output" class="empty"><div><div class="radar">⌁</div><p>Awaiting an authorized target.</p></div></div></section>
  </div>
  <p style="color:var(--muted);font-size:11px;margin-top:18px">Safe mode performs low-impact requests only. Candidate findings require manual validation before submission.</p>
  </main>
<script>
const output=document.querySelector('#output'),button=document.querySelector('#launch');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
fetch('/api/scope').then(r=>r.json()).then(s=>{const all=[...s.domains,...s.url_prefixes];document.querySelector('#scope-list').innerHTML=all.length?all.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="error">No targets configured in .env</span>'});
document.querySelector('#scan-form').addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;output.innerHTML='<div class="empty"><div><div class="radar">⌁</div><p>Validating scope…</p></div></div>';try{const r=await fetch('/api/scans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:document.querySelector('#target').value,authorization_confirmed:document.querySelector('#authorized').checked})});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Request failed');poll(data.id)}catch(err){output.innerHTML=`<p class="error">${esc(err.message)}</p>`;button.disabled=false}});
async function poll(id){const r=await fetch(`/api/scans/${id}`),j=await r.json();render(j);if(['queued','running'].includes(j.status))setTimeout(()=>poll(id),700);else button.disabled=false}
function render(j){const findings=(j.findings||[]).map(f=>`<div class="finding ${esc(f.severity)}"><b>[${esc(f.severity.toUpperCase())}] ${esc(f.title)}</b><small>${esc(f.evidence)} · ${esc(f.status)}</small></div>`).join('');output.className='';output.innerHTML=`<div class="meta"><span>${esc(j.status.toUpperCase())}${j.current_step?' / '+esc(j.current_step):''}</span><span>${j.progress}%</span></div><div class="progress"><div class="bar" style="width:${j.progress}%"></div></div>${j.error?`<p class="error">${esc(j.error)}</p>`:''}${j.status==='completed'?`<h3>${j.findings.length} candidate observation${j.findings.length===1?'':'s'}</h3>${findings||'<p>No candidate findings from safe checks.</p>'}<details><summary>Raw evidence</summary><pre>${esc(JSON.stringify(j.results,null,2))}</pre></details><a class="download" href="/api/scans/${j.id}/report">EXPORT MARKDOWN REPORT</a>`:'<p style="color:var(--muted)">Running low-impact checks. Keep this tab open.</p>'}`}
</script></body></html>
